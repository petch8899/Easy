<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyPDF — แก้ไขข้อความใน PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --paper:#f6f4ee;
    --paper-2:#ffffff;
    --ink:#1e2340;
    --ink-soft:#565c78;
    --line:#e2ddcd;
    --teal:#0f8b8d;
    --teal-dim:#0b6a6b;
    --amber:#dd9b3f;
    --warn:#c1442c;
    --ok:#2f7a53;
    --shadow: 0 1px 2px rgba(30,35,64,.04), 0 6px 20px rgba(30,35,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}
  ::selection{background:var(--teal);color:#fff;}

  /* ---------- top bar ---------- */
  .topnav{
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
    padding:.7rem 1.6rem;
    display:flex;
    align-items:center;
    gap:1rem;
    position:sticky;
    top:0;
    z-index:30;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:.55rem;
    flex:none;
  }
  .brand .gem{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 3px rgba(15,139,141,.25));}
  .brand .name{
    font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;
    letter-spacing:.01em;
    background:linear-gradient(120deg,var(--ink) 30%,var(--teal-dim) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .topnav .fileinfo{
    display:flex;align-items:center;gap:.5rem;font-size:.84rem;font-weight:600;
    color:var(--ink-soft);
  }
  .topnav .fileinfo .pill{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;
    background:#eee9d9;color:#7d754f;padding:.15rem .5rem;border-radius:999px;
  }
  .topnav .spacer{flex:1;}
  .topnav .actions{display:flex;gap:.5rem;flex-wrap:wrap;}

  .wrap{max-width:1420px;margin:0 auto;padding:1.6rem;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
    border:none;border-radius:8px;padding:.6rem .95rem;
    font-size:.83rem;font-weight:600;white-space:nowrap;
    transition:filter .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{background:#c8c2ab;cursor:not-allowed;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);border-color:#b9b193;}
  .btn-ghost.active{color:var(--teal-dim);border-color:var(--teal);background:#eef7f7;}
  .btn-danger{background:transparent;border:1px solid var(--warn);color:var(--warn);}
  .btn-danger:hover{background:var(--warn);color:#fff;}
  .btn-sm{padding:.45rem .75rem;font-size:.78rem;}
  .btn-icon{padding:.4rem;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn-icon:hover{color:var(--ink);border-color:#b9b193;}
  .btn-icon svg{width:15px;height:15px;display:block;}
  .btn-icon:disabled{opacity:.35;cursor:not-allowed;}

  /* ---------- dropzone ---------- */
  .dropzone{
    background:var(--paper-2);
    border:1.5px dashed #cfc7ab;
    border-radius:16px;
    padding:4rem 2rem;
    text-align:center;
    transition:border-color .15s ease, background .15s ease;
    max-width:640px;margin:2.5rem auto 0;
  }
  .dropzone.drag{border-color:var(--teal);background:#f0f8f7;}
  .dropzone .ico{width:44px;height:44px;color:#b9ae87;margin:0 auto 1rem;}
  .dropzone h3{margin:0 0 .4rem;font-size:1.05rem;font-weight:600;}
  .dropzone p{color:var(--ink-soft);font-size:.85rem;margin:0 0 1.3rem;}
  .file-input-label{
    display:inline-flex;align-items:center;gap:.5rem;
    background:var(--teal);color:#fff;
    padding:.7rem 1.3rem;border-radius:8px;
    font-size:.87rem;font-weight:600;
  }
  .file-input-label:hover{background:var(--teal-dim);}
  .file-input-label input{display:none;}

  /* ---------- toolstrip ---------- */
  .toolstrip{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:1rem 1.2rem;box-shadow:var(--shadow);margin-bottom:1rem;
    display:flex;align-items:flex-end;gap:1.3rem;flex-wrap:wrap;
  }
  .side-controls{
    display:flex;flex-direction:column;gap:.9rem;
    padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid var(--line);
  }
  .side-controls .tf-item, .side-controls .color-field{width:100%;}
  .side-controls .tf-font, .side-controls .tf-size{width:100%;}
  .side-controls .tf-bold-wrap{padding-bottom:0;}
  .tf-item label{display:block;font-size:.72rem;color:var(--ink-soft);margin-bottom:.35rem;font-weight:600;}
  .tf-item select, .tf-item input[type="number"]{
    background:#faf8f2;border:1px solid var(--line);border-radius:8px;
    padding:.5rem .65rem;font-size:.84rem;color:var(--ink);outline:none;
  }
  .tf-item select:focus, .tf-item input:focus{border-color:var(--teal);}
  .tf-size{width:72px;}
  .tf-font{min-width:190px;}
  .tf-bold-wrap{display:flex;align-items:center;gap:.4rem;padding-bottom:.55rem;}
  .tf-bold-wrap input{width:16px;height:16px;accent-color:var(--teal);}
  .tf-bold-wrap label{font-size:.82rem;color:var(--ink-soft);font-weight:600;margin:0;}

  .color-field{display:flex;flex-direction:column;}
  .color-field .row{display:flex;align-items:center;gap:.5rem;}
  .color-field input[type="color"]{
    -webkit-appearance:none;appearance:none;
    width:40px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;
    background:#faf8f2;cursor:pointer;flex:none;
  }
  .color-field input[type="color"]::-webkit-color-swatch-wrapper{padding:3px;}
  .color-field input[type="color"]::-webkit-color-swatch{border:none;border-radius:6px;}
  .color-hex{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--ink-soft);}
  .swatch-row{display:flex;gap:.28rem;margin-top:.4rem;}
  .swatch{
    width:16px;height:16px;border-radius:50%;border:1.5px solid #fff;
    box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;
  }
  .swatch:hover{box-shadow:0 0 0 1.5px var(--teal);}

  /* ---------- secondary tools row ---------- */
  .toolrow2{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}

  /* ---------- page thumb strip ---------- */
  .thumb-strip{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:1rem;
    display:flex;gap:.7rem;overflow-x:auto;
  }
  .thumb-card{
    flex:none;width:78px;text-align:center;cursor:pointer;border-radius:8px;
    border:2px solid transparent;padding:.3rem;position:relative;
  }
  .thumb-card.active{border-color:var(--teal);background:#eef7f7;}
  .thumb-card img{width:100%;border-radius:4px;border:1px solid var(--line);display:block;}
  .thumb-card .n{font-size:.68rem;color:var(--ink-soft);margin-top:.3rem;font-family:'JetBrains Mono',monospace;}
  .thumb-mini-controls{display:flex;justify-content:center;gap:.15rem;margin-top:.25rem;}
  .thumb-mini-controls button{
    background:transparent;border:none;color:var(--ink-soft);padding:.1rem;border-radius:4px;
  }
  .thumb-mini-controls button:hover{color:var(--ink);background:#eee9d9;}
  .thumb-mini-controls svg{width:12px;height:12px;display:block;}

  /* ---------- main editor area ---------- */
  .editor-main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:1.2rem;
    align-items:start;
  }
  .canvas-resizable{
    resize:both;
    overflow:auto;
    background:#efeadb;
    border:1px solid var(--line);border-radius:14px;
    padding:1rem;box-shadow:var(--shadow);
    width:100%;
    min-width:320px;
    min-height:520px;
    height:88vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .canvas-scroll{
    flex:1;width:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  }
  .canvas-resizable canvas{
    max-width:100%;
    border:1px solid var(--line);border-radius:4px;cursor:crosshair;background:#fff;
    box-shadow:0 2px 10px rgba(30,35,64,.08);
  }
  .canvas-resize-hint{
    font-size:.72rem;color:#9c8f6f;margin-top:.5rem;display:flex;align-items:center;gap:.35rem;flex:none;
  }
  .page-nav{
    display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;flex:none;
  }
  .page-nav .ind{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--ink-soft);min-width:70px;text-align:center;}

  .side-panel{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:1.2rem 1.3rem;box-shadow:var(--shadow);
    position:sticky;top:5.2rem;
    max-height:calc(100vh - 6rem);
    overflow-y:auto;
  }
  .mode-tabs{display:flex;gap:.35rem;margin-bottom:1.1rem;background:#f1eee4;padding:.3rem;border-radius:10px;}
  .mode-tabs button{
    flex:1;background:transparent;border:none;padding:.55rem .4rem;border-radius:8px;
    font-size:.8rem;font-weight:600;color:var(--ink-soft);
  }
  .mode-tabs button.active{background:#fff;color:var(--teal-dim);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .field{margin-bottom:.9rem;}
  .field label{display:block;font-size:.76rem;color:var(--ink-soft);margin-bottom:.35rem;font-weight:600;}
  .field textarea, .field input[type="text"]{
    width:100%;background:#faf8f2;border:1px solid var(--line);border-radius:8px;
    padding:.6rem .75rem;font-size:.87rem;color:var(--ink);outline:none;resize:vertical;
  }
  .field textarea:focus, .field input:focus{border-color:var(--teal);}
  .field .readonly{
    background:#f1eee4;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;
    padding:.6rem .75rem;font-size:.85rem;min-height:2.4rem;line-height:1.5;
  }

  .hint-box{
    background:#eef7f7;border:1px solid #c9e6e6;border-radius:10px;
    padding:.65rem .8rem;font-size:.78rem;color:var(--teal-dim);margin-bottom:1rem;
    line-height:1.5;display:flex;gap:.5rem;align-items:flex-start;
  }
  .hint-box svg{width:15px;height:15px;flex:none;margin-top:.1rem;}
  .empty-hint{
    text-align:center;color:var(--ink-soft);font-size:.85rem;padding:2rem 1rem;
    border:1px dashed var(--line);border-radius:10px;
  }
  .edit-count{
    font-size:.75rem;color:#9c8f6f;text-align:center;margin-top:.9rem;
  }

  .panel-inline{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:1.2rem 1.3rem;box-shadow:var(--shadow);margin-bottom:1rem;
  }
  .panel-inline h3{font-size:.95rem;margin:0 0 1rem;font-weight:600;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}

  .toast{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:14px;
    font-size:.83rem;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:100;
    display:flex;align-items:center;gap:.5rem;
    max-width:min(90vw,480px);text-align:left;line-height:1.5;
  }
  .toast.warn{background:var(--warn);}
  .toast.ok{background:var(--ok);}

  .loading-overlay{
    position:fixed;inset:0;background:rgba(246,244,238,.82);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:200;
  }
  .spinner{
    width:38px;height:38px;border-radius:50%;
    border:3px solid #dcd6bf;border-top-color:var(--teal);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay .msg{font-size:.88rem;color:var(--ink-soft);}

  .drag-veil{
    position:fixed;inset:0;background:rgba(15,139,141,.14);
    border:3px dashed var(--teal);z-index:150;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .drag-veil .msg{
    background:#fff;padding:1rem 1.6rem;border-radius:12px;font-weight:700;color:var(--teal-dim);
    box-shadow:var(--shadow);font-size:1rem;
  }

  @media (max-width:980px){
    .editor-main{grid-template-columns:1fr;}
    .side-panel{position:static;}
    .canvas-resizable{height:60vh;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ==================================================================
   EasyPDF — แก้ไขข้อความใน PDF โดยตรงในเบราว์เซอร์ (ไม่มีการอัปโหลดขึ้นเซิร์ฟเวอร์)
   ================================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---- font library: Thai-capable fonts (fetched + embedded) + built-in standard fonts (instant, Latin-only) ----
const FONT_LIBRARY = [
  { key:'sarabun', label:'Sarabun (ตัวอ่านง่าย)', thai:true,
    regular:['https://raw.githubusercontent.com/cadsondemak/Sarabun/master/fonts/Sarabun-Regular.ttf','https://cdn.jsdelivr.net/gh/cadsondemak/Sarabun@master/fonts/Sarabun-Regular.ttf','https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/Sarabun-Regular.ttf'],
    bold:['https://raw.githubusercontent.com/cadsondemak/Sarabun/master/fonts/Sarabun-Bold.ttf','https://cdn.jsdelivr.net/gh/cadsondemak/Sarabun@master/fonts/Sarabun-Bold.ttf','https://raw.githubusercontent.com/google/fonts/main/ofl/sarabun/Sarabun-Bold.ttf'] },
  { key:'kanit', label:'Kanit (โมเดิร์น)', thai:true,
    regular:['https://raw.githubusercontent.com/google/fonts/main/ofl/kanit/Kanit-Regular.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/kanit/Kanit-Regular.ttf'],
    bold:['https://raw.githubusercontent.com/google/fonts/main/ofl/kanit/Kanit-Bold.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/kanit/Kanit-Bold.ttf'] },
  { key:'prompt', label:'Prompt (คลีน)', thai:true,
    regular:['https://raw.githubusercontent.com/google/fonts/main/ofl/prompt/Prompt-Regular.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/prompt/Prompt-Regular.ttf'],
    bold:['https://raw.githubusercontent.com/google/fonts/main/ofl/prompt/Prompt-Bold.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/prompt/Prompt-Bold.ttf'] },
  { key:'mitr', label:'Mitr (โค้งมน)', thai:true,
    regular:['https://raw.githubusercontent.com/google/fonts/main/ofl/mitr/Mitr-Regular.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/mitr/Mitr-Regular.ttf'],
    bold:['https://raw.githubusercontent.com/google/fonts/main/ofl/mitr/Mitr-Bold.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/mitr/Mitr-Bold.ttf'] },
  { key:'chakrapetch', label:'Chakra Petch (เหลี่ยม/เทคโน)', thai:true,
    regular:['https://raw.githubusercontent.com/google/fonts/main/ofl/chakrapetch/ChakraPetch-Regular.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/chakrapetch/ChakraPetch-Regular.ttf'],
    bold:['https://raw.githubusercontent.com/google/fonts/main/ofl/chakrapetch/ChakraPetch-Bold.ttf','https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/chakrapetch/ChakraPetch-Bold.ttf'] },
  { key:'helvetica', label:'Helvetica (อังกฤษเท่านั้น)', thai:false, standard:'Helvetica', standardBold:'HelveticaBold' },
  { key:'times', label:'Times New Roman (อังกฤษเท่านั้น)', thai:false, standard:'TimesRoman', standardBold:'TimesRomanBold' },
  { key:'courier', label:'Courier (อังกฤษเท่านั้น)', thai:false, standard:'Courier', standardBold:'CourierBold' },
];
const THAI_CHAR_REGEX = /[\u0E00-\u0E7F]/;
const fontBytesCache = {}; // key: "<fontKey>-regular"|"<fontKey>-bold" -> ArrayBuffer

const state = {
  loading: false,
  loadingMsg: '',
  toast: null,
  dragVeil: false,

  editDoc: null,
  editFileName: '',
  editThumbs: [],
  previewPageIndex: 0,
  previewCanvasScale: 1,
  currentPageTextItems: [],
  pageItemsCache: {},      // pageIndex -> stable array of editable items (persists across redraws, updated locally on edit)
  selectedItemIndex: null,
  draftText: null,          // preserves what the user typed in the "new text" box across any incidental re-render

  mode: 'edit',            // 'edit' | 'add'
  placedPoint: null,       // {page, x, y} for add mode
  editCount: 0,

  showWatermarkForm: false,
  showMergeInfo: false,
  showThumbStrip: false,

  // toolstrip settings — persist across edits automatically (same font/color reused next time)
  toolFont: 'sarabun',
  toolBold: false,
  toolSize: 18,
  toolTextColor: '#000000',
  toolCoverColor: '#ffffff',
};

let previewRenderGen = 0;

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, kind){
  state.toast = {msg, kind: kind||''};
  render();
  const duration = kind === 'warn' ? 6500 : 3000;
  setTimeout(()=>{ state.toast=null; render(); }, duration);
}
function setLoading(on, msg){
  state.loading = on;
  state.loadingMsg = msg || 'กำลังประมวลผล...';
  render();
}
function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:((num>>16)&255)/255, g:((num>>8)&255)/255, b:(num&255)/255 };
}
const COLOR_PRESETS = ['#000000','#ffffff','#1e2340','#c1442c','#e2492f','#dd9b3f','#f5d033','#2f7a53','#0f8b8d','#3b6fd6','#8b5cf6','#e35bb3'];
function colorField(id, label, value){
  return `
    <div class="tf-item color-field">
      <label>${label}</label>
      <div class="row">
        <input type="color" id="${id}" value="${value}" oninput="document.getElementById('${id}-hex').textContent=this.value">
        <span class="color-hex" id="${id}-hex">${value}</span>
      </div>
      <div class="swatch-row">
        ${COLOR_PRESETS.map(c => `<button type="button" class="swatch" style="background:${c}" title="${c}" onclick="document.getElementById('${id}').value='${c}';document.getElementById('${id}-hex').textContent='${c}';"></button>`).join('')}
      </div>
    </div>
  `;
}

// ================= FONT LOADING (resilient, cached, session-persistent) =================
async function fetchFirstWorking(urls){
  let lastErr = null;
  for(const url of urls){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 12000);
      const res = await fetch(url, {signal: controller.signal});
      clearTimeout(timeout);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const bytes = await res.arrayBuffer();
      if(!bytes || bytes.byteLength < 1000) throw new Error('ไฟล์ฟอนต์มีขนาดผิดปกติ');
      return bytes;
    }catch(err){
      lastErr = err;
      console.warn('โหลดฟอนต์จาก', url, 'ไม่สำเร็จ:', err);
    }
  }
  throw new Error('ไม่สามารถโหลดฟอนต์ได้ (ตรวจสอบอินเทอร์เน็ต): ' + (lastErr && lastErr.message));
}
async function ensureFontBytes(fontKey, bold){
  const entry = FONT_LIBRARY.find(f => f.key === fontKey);
  if(!entry || !entry.thai) return null;
  const cacheKey = fontKey + (bold ? '-bold' : '-regular');
  if(!fontBytesCache[cacheKey]){
    fontBytesCache[cacheKey] = await fetchFirstWorking(bold ? entry.bold : entry.regular);
  }
  return fontBytesCache[cacheKey];
}
let embeddedFontCache = new WeakMap(); // state.editDoc -> { 'sarabun-regular': fontObject, ... }
let fontkitRegisteredDocs = new WeakSet();
async function embedSelectedFont(fontKey, bold){
  if(!embeddedFontCache.has(state.editDoc)) embeddedFontCache.set(state.editDoc, {});
  const docCache = embeddedFontCache.get(state.editDoc);
  const cacheKey = fontKey + (bold ? '-bold' : '-regular');
  if(docCache[cacheKey]) return docCache[cacheKey];

  const entry = FONT_LIBRARY.find(f => f.key === fontKey) || FONT_LIBRARY[0];
  let font;
  if(!entry.thai){
    const stdName = bold ? entry.standardBold : entry.standard;
    font = await state.editDoc.embedFont(PDFLib.StandardFonts[stdName]);
  } else {
    if(!fontkitRegisteredDocs.has(state.editDoc)){
      state.editDoc.registerFontkit(fontkit);
      fontkitRegisteredDocs.add(state.editDoc);
    }
    const bytes = await ensureFontBytes(entry.key, bold);
    // subset:false — the in-app preview renderer (pdf.js) has trouble rasterizing
    // pdf-lib's subsetted font glyph tables, which makes new text silently invisible
    // in the preview even though it's correctly embedded in the file. Full embedding
    // is slightly larger but renders reliably everywhere.
    font = await state.editDoc.embedFont(bytes, {subset:false});
  }
  docCache[cacheKey] = font;
  return font;
}
function warmFont(fontKey){
  const entry = FONT_LIBRARY.find(f => f.key === fontKey);
  if(entry && entry.thai){
    ensureFontBytes(fontKey, false).catch(()=>{});
    ensureFontBytes(fontKey, true).catch(()=>{});
  }
}

async function loadEditFile(file){
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    showToast('กรุณาเลือกไฟล์ PDF เท่านั้น', 'warn');
    return;
  }
  setLoading(true, 'กำลังเปิดไฟล์ PDF...');
  try{
    const bytes = await file.arrayBuffer();
    const doc = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption:true});
    state.editDoc = doc;
    state.editFileName = file.name;
    state.editCount = 0;
    state.previewPageIndex = 0;
    state.selectedItemIndex = null;
    state.mode = 'edit';
    state.showThumbStrip = false;
    state.pageItemsCache = {};
    warmFont(state.toolFont); // pre-fetch default font in background so first edit is instant
    await refreshEditThumbnails();
    setLoading(false);
  }catch(err){
    setLoading(false);
    showToast('ไม่สามารถเปิดไฟล์นี้ได้ ไฟล์อาจเสียหายหรือมีการเข้ารหัส', 'warn');
    console.error(err);
  }
}

async function refreshEditThumbnails(){
  const bytes = await state.editDoc.save();
  const loadingTask = pdfjsLib.getDocument({data: bytes});
  const pdfjsDoc = await loadingTask.promise;
  const thumbs = [];
  for(let i=1;i<=pdfjsDoc.numPages;i++){
    const page = await pdfjsDoc.getPage(i);
    const viewport = page.getViewport({scale: 0.32});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    thumbs.push(canvas.toDataURL('image/png'));
  }
  state.editThumbs = thumbs;
  if(state.previewPageIndex >= thumbs.length) state.previewPageIndex = Math.max(0, thumbs.length-1);
  render();
}

// ================= CANVAS RENDER + HIT-TESTING =================
async function drawPreviewCanvas(){
  const myGen = ++previewRenderGen;
  const canvas = document.getElementById('preview-canvas');
  if(!canvas) return;
  const bytes = await state.editDoc.save();
  if(myGen !== previewRenderGen) return;
  const loadingTask = pdfjsLib.getDocument({data: bytes});
  const pdfjsDoc = await loadingTask.promise;
  if(myGen !== previewRenderGen) return;
  const page = await pdfjsDoc.getPage(state.previewPageIndex + 1);
  const viewport = page.getViewport({scale: 2.0});
  if(myGen !== previewRenderGen) return;
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  state.previewCanvasScale = viewport.scale;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext: ctx, viewport}).promise;
  if(myGen !== previewRenderGen) return;

  // IMPORTANT: we do NOT re-derive the editable-text list from a fresh text-extraction
  // every redraw. Covering old text with a rectangle doesn't remove it from the PDF's
  // content stream — it's still there, just visually hidden — so re-extracting would
  // surface it again as a "ghost" clickable target sitting in the same spot as the new
  // text drawn on top of it. Instead we compute this page's item list ONCE (the first
  // time it's viewed) and keep updating that same stable list locally as edits are made.
  if(!state.pageItemsCache[state.previewPageIndex]){
    const content = await page.getTextContent();
    if(myGen !== previewRenderGen) return;
    state.pageItemsCache[state.previewPageIndex] = content.items
      .filter(it => it.str.trim() !== '')
      .map(it => ({
        str: it.str,
        pdfX: it.transform[4],
        pdfY: it.transform[5],
        pdfWidth: it.width,
        pdfHeight: it.height || Math.abs(it.transform[3]) || 12,
        removed: false
      }));
  }
  const pageItems = state.pageItemsCache[state.previewPageIndex];

  // convert the stable PDF-space items to this render's canvas-space boxes for hit-testing/highlighting
  const items = pageItems.map(it => {
    if(it.removed) return {...it, cx1:-1,cy1:-1,cx2:-1,cy2:-1};
    const rect = viewport.convertToViewportRectangle([it.pdfX, it.pdfY, it.pdfX + it.pdfWidth, it.pdfY + it.pdfHeight]);
    const cx1 = Math.min(rect[0], rect[2]);
    const cx2 = Math.max(rect[0], rect[2]);
    const cy1 = Math.min(rect[1], rect[3]);
    const cy2 = Math.max(rect[1], rect[3]);
    return { ...it, cx1, cy1, cx2, cy2 };
  });
  state.currentPageTextItems = items;

  if(state.mode === 'edit' && state.selectedItemIndex !== null && items[state.selectedItemIndex]){
    const it = items[state.selectedItemIndex];
    ctx.save();
    ctx.fillStyle = 'rgba(15,139,141,0.22)';
    ctx.strokeStyle = 'rgba(15,139,141,0.9)';
    ctx.lineWidth = 1.5;
    ctx.fillRect(it.cx1-1, it.cy1-1, (it.cx2-it.cx1)+2, (it.cy2-it.cy1)+2);
    ctx.strokeRect(it.cx1-1, it.cy1-1, (it.cx2-it.cx1)+2, (it.cy2-it.cy1)+2);
    ctx.restore();
  }
  if(state.mode === 'add' && state.placedPoint && state.placedPoint.page === state.previewPageIndex){
    const vp = viewport.convertToViewportPoint(state.placedPoint.x, state.placedPoint.y);
    ctx.save();
    ctx.fillStyle = 'rgba(221,155,63,0.9)';
    ctx.beginPath();
    ctx.arc(vp[0], vp[1], 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function handleCanvasClick(e){
  const canvas = document.getElementById('preview-canvas');
  const rect = canvas.getBoundingClientRect();
  const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  if(state.mode === 'edit'){
    let foundIdx = null;
    for(let i=0;i<state.currentPageTextItems.length;i++){
      const it = state.currentPageTextItems[i];
      if(it.removed) continue;
      if(clickX >= it.cx1-2 && clickX <= it.cx2+2 && clickY >= it.cy1-2 && clickY <= it.cy2+2){
        foundIdx = i; break;
      }
    }
    state.selectedItemIndex = foundIdx;
    state.draftText = null;
    if(foundIdx !== null) state.toolSize = Math.round(state.currentPageTextItems[foundIdx].pdfHeight);
    render();
    return;
  }

  const pdfPage = state.editDoc.getPage(state.previewPageIndex);
  const {height} = pdfPage.getSize();
  const scale = state.previewCanvasScale;
  const x = clickX / scale;
  const y = height - (clickY / scale);
  state.placedPoint = {page: state.previewPageIndex, x, y};
  render();
}

// ================= APPLY EDITS =================
function checkThaiFontMismatch(text){
  const entry = FONT_LIBRARY.find(f => f.key === state.toolFont);
  if(entry && !entry.thai && THAI_CHAR_REGEX.test(text)){
    showToast('ฟอนต์ที่เลือก (' + entry.label + ') ไม่รองรับภาษาไทย กรุณาเลือกฟอนต์อื่น เช่น Sarabun หรือ Kanit', 'warn');
    return false;
  }
  return true;
}

async function applyReplaceText(){
  if(state.selectedItemIndex === null){ showToast('กรุณาเลือกข้อความที่ต้องการแก้ไขก่อน', 'warn'); return; }
  const editedIndex = state.selectedItemIndex;
  const item = state.currentPageTextItems[editedIndex];
  const newText = document.getElementById('et-text').value;
  if(newText.trim() && !checkThaiFontMismatch(newText)) return;

  setLoading(true, 'กำลังโหลดฟอนต์และแก้ไขข้อความ...');
  try{
    const page = state.editDoc.getPage(state.previewPageIndex);
    const cover = hexToRgb(state.toolCoverColor);

    let font = null;
    if(newText.trim()){
      font = await embedSelectedFont(state.toolFont, state.toolBold);
    }

    page.drawRectangle({
      x: item.pdfX - 1.5,
      y: item.pdfY - item.pdfHeight * 0.28,
      width: item.pdfWidth + 3,
      height: item.pdfHeight * 1.3,
      color: PDFLib.rgb(cover.r, cover.g, cover.b)
    });
    if(font){
      const rgbColor = hexToRgb(state.toolTextColor);
      page.drawText(newText, {
        x: item.pdfX,
        y: item.pdfY,
        size: state.toolSize,
        font,
        color: PDFLib.rgb(rgbColor.r, rgbColor.g, rgbColor.b)
      });
    }
    state.selectedItemIndex = null;
    state.draftText = null;
    state.editCount++;
    // update the stable cache entry so this slot reflects the new text (and won't
    // reappear as a stale "ghost" of its old self on future redraws/clicks)
    const cacheEntry = state.pageItemsCache[state.previewPageIndex][editedIndex];
    if(cacheEntry){
      if(newText.trim()){ cacheEntry.str = newText; }
      else { cacheEntry.removed = true; }
    }
    await refreshEditThumbnails();
    setLoading(false);
    showToast('แก้ไขข้อความสำเร็จ — เลือกคำถัดไปเพื่อแก้ไขต่อได้เลย', 'ok');
  }catch(err){
    setLoading(false);
    showToast('แก้ไขข้อความไม่สำเร็จ: ' + (err && err.message ? err.message : 'เกิดข้อผิดพลาด'), 'warn');
    console.error(err);
  }
}

async function applyDeleteText(){
  if(state.selectedItemIndex === null) return;
  const editedIndex = state.selectedItemIndex;
  const item = state.currentPageTextItems[editedIndex];
  setLoading(true, 'กำลังลบข้อความ...');
  try{
    const page = state.editDoc.getPage(state.previewPageIndex);
    const cover = hexToRgb(state.toolCoverColor);
    page.drawRectangle({
      x: item.pdfX - 1.5,
      y: item.pdfY - item.pdfHeight * 0.28,
      width: item.pdfWidth + 3,
      height: item.pdfHeight * 1.3,
      color: PDFLib.rgb(cover.r, cover.g, cover.b)
    });
    state.selectedItemIndex = null;
    state.draftText = null;
    state.editCount++;
    const cacheEntry = state.pageItemsCache[state.previewPageIndex][editedIndex];
    if(cacheEntry) cacheEntry.removed = true;
    await refreshEditThumbnails();
    setLoading(false);
    showToast('ลบข้อความสำเร็จ', 'ok');
  }catch(err){
    setLoading(false);
    showToast('ลบข้อความไม่สำเร็จ: ' + (err && err.message ? err.message : 'เกิดข้อผิดพลาด'), 'warn');
    console.error(err);
  }
}

async function applyAddText(){
  if(!state.placedPoint){ showToast('กรุณาคลิกบนหน้าเอกสารเพื่อกำหนดตำแหน่งก่อน', 'warn'); return; }
  const text = document.getElementById('tf-text').value;
  if(!text.trim()){ showToast('กรุณากรอกข้อความ', 'warn'); return; }
  if(!checkThaiFontMismatch(text)) return;

  setLoading(true, 'กำลังโหลดฟอนต์และเพิ่มข้อความ...');
  try{
    const font = await embedSelectedFont(state.toolFont, state.toolBold);
    const page = state.editDoc.getPage(state.placedPoint.page);
    const rgbColor = hexToRgb(state.toolTextColor);
    text.split('\n').forEach((line, idx) => {
      page.drawText(line, {
        x: state.placedPoint.x,
        y: state.placedPoint.y - idx * (state.toolSize * 1.25),
        size: state.toolSize,
        font,
        color: PDFLib.rgb(rgbColor.r, rgbColor.g, rgbColor.b)
      });
    });
    state.placedPoint = null;
    state.editCount++;
    document.getElementById('tf-text').value = '';
    await refreshEditThumbnails();
    setLoading(false);
    showToast('เพิ่มข้อความสำเร็จ — คลิกตำแหน่งถัดไปเพื่อเพิ่มต่อได้เลย', 'ok');
  }catch(err){
    setLoading(false);
    showToast('เพิ่มข้อความไม่สำเร็จ: ' + (err && err.message ? err.message : 'เกิดข้อผิดพลาด'), 'warn');
    console.error(err);
  }
}

// ================= PAGE MANAGEMENT =================
function toggleThumbStrip(){ state.showThumbStrip = !state.showThumbStrip; render(); }

function renderThumbStrip(){
  return `
    <div class="thumb-strip">
      ${state.editThumbs.map((src,i) => `
        <div class="thumb-card ${i===state.previewPageIndex?'active':''}" onclick="jumpToPage(${i})">
          <img src="${src}" alt="หน้า ${i+1}">
          <div class="n">หน้า ${i+1}</div>
          <div class="thumb-mini-controls">
            <button title="ย้ายขึ้น" onclick="event.stopPropagation();movePage(${i},-1)" ${i===0?'disabled':''}>${ICONS.up}</button>
            <button title="ย้ายลง" onclick="event.stopPropagation();movePage(${i},1)" ${i===state.editThumbs.length-1?'disabled':''}>${ICONS.down}</button>
            <button title="หมุน" onclick="event.stopPropagation();rotatePage(${i})">${ICONS.rotate}</button>
            <button title="ลบหน้านี้" onclick="event.stopPropagation();deleteOnePage(${i})">${ICONS.trash}</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function jumpToPage(i){
  state.previewPageIndex = i;
  state.selectedItemIndex = null;
  state.draftText = null;
  state.placedPoint = null;
  render();
}
async function movePage(i, dir){
  const newIndex = i + dir;
  const count = state.editDoc.getPageCount();
  if(newIndex < 0 || newIndex >= count) return;
  const order = [...Array(count).keys()];
  const tmp = order[i]; order[i] = order[newIndex]; order[newIndex] = tmp;
  await rebuildDocOrder(order);
}
async function rebuildDocOrder(order){
  setLoading(true, 'กำลังจัดเรียงหน้า...');
  const newDoc = await PDFLib.PDFDocument.create();
  const copied = await newDoc.copyPages(state.editDoc, order);
  copied.forEach(p => newDoc.addPage(p));
  state.editDoc = newDoc;
  state.pageItemsCache = {}; // page order/content mapping changed — old cached positions no longer valid
  state.selectedItemIndex = null;
  await refreshEditThumbnails();
  setLoading(false);
}
async function rotatePage(i){
  const page = state.editDoc.getPage(i);
  const current = page.getRotation().angle;
  page.setRotation(PDFLib.degrees((current + 90) % 360));
  await refreshEditThumbnails();
}
async function deleteOnePage(i){
  if(state.editDoc.getPageCount() <= 1){
    showToast('ต้องมีอย่างน้อย 1 หน้าในเอกสาร', 'warn');
    return;
  }
  const count = state.editDoc.getPageCount();
  const order = [...Array(count).keys()].filter(x => x !== i);
  await rebuildDocOrder(order);
}
async function handleMergeInput(e){
  const file = e.target.files[0];
  if(!file) return;
  setLoading(true, 'กำลังรวมไฟล์ PDF...');
  try{
    const bytes = await file.arrayBuffer();
    const otherDoc = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption:true});
    const copied = await state.editDoc.copyPages(otherDoc, otherDoc.getPageIndices());
    copied.forEach(p => state.editDoc.addPage(p));
    await refreshEditThumbnails();
    setLoading(false);
    showToast('รวมไฟล์สำเร็จ', 'ok');
  }catch(err){
    setLoading(false);
    showToast('ไม่สามารถรวมไฟล์นี้ได้', 'warn');
    console.error(err);
  }
}

// ================= WATERMARK =================
function toggleWatermarkForm(){
  state.showWatermarkForm = !state.showWatermarkForm;
  render();
}
function renderWatermarkForm(){
  return `
    <div class="panel-inline">
      <h3>ใส่ลายน้ำข้อความ (ทุกหน้า)</h3>
      <div class="field-row">
        <div class="field"><label>ข้อความลายน้ำ</label><input type="text" id="wm-text" value="ตัวอย่างเอกสาร"></div>
        <div class="field"><label>ขนาดตัวอักษร</label><input type="text" id="wm-size" value="48"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>ความโปร่งใส (0.05–1)</label><input type="text" id="wm-opacity" value="0.18"></div>
        <div class="field"><label>มุมหมุน (องศา)</label><input type="text" id="wm-angle" value="45"></div>
      </div>
      ${colorField('wm-color', 'สีลายน้ำ', '#666666')}
      <div style="display:flex;gap:.6rem;margin-top:1rem;">
        <button class="btn btn-amber" onclick="applyWatermark()">ใส่ลายน้ำ</button>
        <button class="btn btn-ghost" onclick="toggleWatermarkForm()">ปิด</button>
      </div>
    </div>
  `;
}
async function applyWatermark(){
  const text = document.getElementById('wm-text').value.trim();
  const size = parseFloat(document.getElementById('wm-size').value) || 48;
  const opacity = parseFloat(document.getElementById('wm-opacity').value) || 0.18;
  const angle = parseFloat(document.getElementById('wm-angle').value) || 45;
  const colorHex = document.getElementById('wm-color').value.trim() || '#666666';
  if(!text){ showToast('กรุณากรอกข้อความลายน้ำ', 'warn'); return; }
  if(!checkThaiFontMismatch(text)) return;

  setLoading(true, 'กำลังใส่ลายน้ำ...');
  try{
    const font = await embedSelectedFont(state.toolFont, state.toolBold);
    const rgbColor = hexToRgb(colorHex);
    const pages = state.editDoc.getPages();
    pages.forEach(page => {
      const {width, height} = page.getSize();
      const textWidth = font.widthOfTextAtSize(text, size);
      page.drawText(text, {
        x: width/2 - textWidth/2,
        y: height/2,
        size, font,
        color: PDFLib.rgb(rgbColor.r, rgbColor.g, rgbColor.b),
        opacity,
        rotate: PDFLib.degrees(angle)
      });
    });
    state.editCount++;
    await refreshEditThumbnails();
    state.showWatermarkForm = false;
    setLoading(false);
    showToast('ใส่ลายน้ำสำเร็จ', 'ok');
  }catch(err){
    setLoading(false);
    showToast('ใส่ลายน้ำไม่สำเร็จ: ' + (err && err.message ? err.message : 'เกิดข้อผิดพลาด'), 'warn');
    console.error(err);
  }
}

// ================= DOWNLOAD =================
async function downloadEditedPdf(){
  setLoading(true, 'กำลังสร้างไฟล์ PDF...');
  try{
    const bytes = await state.editDoc.save();
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const base = state.editFileName.replace(/\.pdf$/i,'') || 'document';
    a.href = url; a.download = base + '-แก้ไขแล้ว.pdf';
    a.click();
    URL.revokeObjectURL(url);
    setLoading(false);
  }catch(err){
    setLoading(false);
    showToast('ไม่สามารถสร้างไฟล์ PDF ได้', 'warn');
    console.error(err);
  }
}

// ---------- boot ----------
render();
</script>
